[package]
name = "stoat-gpui"
version = "0.1.0"
edition = "2024"
description = "Proof-of-concept Stoat Chat desktop client built with GPUI"
publish = false

[workspace]
members = [".", "ios/stoat-ffi"]

[features]
default = ["desktop"]
# The desktop app: GPUI, voice (LiveKit) and the Keychain through `keyring`.
# Without it the library builds for iOS (see ios/), keeping only the
# networking, state and logic modules.
desktop = ["dep:gpui-kit", "dep:livekit", "dep:keyring"]

[[bin]]
name = "stoat-gpui"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
# Pinned: gpui-kit bundles a specific gpui-pre snapshot plus gpui-component.
gpui-kit = { version = "=0.9.0", optional = true }

# Wire types straight from the Stoat backend (MIT). Pinned to the live API
# version; bump all revolt-* crates together. Default features pull in the
# Rocket server integration, which a client doesn't need.
revolt-models = { version = "=0.16.4", default-features = false, features = ["serde", "partials"] }
revolt-result = { version = "=0.16.4", default-features = false, features = ["serde"] }
# Stoat's own permission maths (owners, role and channel overrides, timeouts),
# for what a user may see or do in a channel. Its `PermissionQuery` trait is
# declared with `#[async_trait]`, so implementing it needs that crate too.
revolt-permissions = { version = "=0.16.4", default-features = false }
async-trait = "0.1"
# The `Timestamp` Stoat's wire types use (a member's timeout), as revolt-models
# depends on it.
iso8601-timestamp = "0.2"

# `multipart` and `stream` for attachment uploads with progress.
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
# Events websocket: rustls, with its trust roots per platform (below).
tokio-tungstenite = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
url = "2"
# Decoding an embed picture's name from its address (src/file_actions.rs).
# Already in the tree, through `url`.
percent-encoding = "2"
# Emoji character classes, for "only emoji" (jumbo) messages. Already in the tree.
unicode-properties = "0.1"
# CSS colour names for `$$\color{…}$$` (see src/math.rs). Already in the tree (via resvg).
svgtypes = "0.16"
# Blurred previews of uploads while they load (Stoat stores a ThumbHash with each image).
thumbhash = "0.1"
# Pixel buffers for those previews, as GPUI takes them, and pictures turned
# into PNG for the clipboard (src/file_actions.rs). The version and decoders
# GPUI already uses.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Local-time formatting for message timestamps.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# An attachment's MIME type from its extension. Already in the tree.
mime_guess = "2"
# The QR code for setting up an authenticator app (src/security.rs). Nayuki's
# reference encoder: small, with no dependencies.
qrcodegen = "1.8"
thiserror = "2"
# Session token storage: macOS Keychain (Windows/Linux stores come along with the v1 feature).
keyring = { version = "4.2", optional = true }
# `fs` and `io-util` for streaming uploads from disk.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "io-util"] }
futures = "0.3"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
emojis = "0.9.1"
# The parser inside TextView (already in the tree, through gpui-base): finding
# links whose text isn't their address (`markdown::guard_links`), and in tests,
# checking what `prepare` produces parses as intended.
markdown = "1"
# New category IDs (src/server_edit.rs), as the web client makes them. Its
# `rand` is already in the tree.
ulid = "3"
# Voice calls (src/voice.rs): LiveKit's Rust SDK, the server Stoat's voice
# runs on. Pinned like the revolt crates; upstream, not Zed's fork. Its build
# downloads a prebuilt WebRTC (~264 MB) into the target directory, and the
# app binary needs `-ObjC` (see build.rs). rustls with the macOS trust store,
# matching tokio-tungstenite.
livekit = { version = "=0.10.1", features = ["rustls-tls-native-roots"], optional = true }
# Picking rustls's crypto provider at startup (src/main.rs): livekit brings
# `ring` alongside reqwest's `aws-lc-rs`, and with both rustls won't choose.
# The version already in the tree.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# The events websocket's TLS roots: the system trust store on desktop, matching
# reqwest's TLS stack, and Mozilla's bundled roots on iOS, where there are no
# macOS trust settings for rustls-native-certs to read.
[target.'cfg(not(target_os = "ios"))'.dependencies]
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }

[target.'cfg(target_os = "ios")'.dependencies]
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Dock badge (AppKit's NSDockTile), checking whether banners can be posted
# (bundle identifier, notification permission), hiding the main window
# (NSWindow), the notification sound (NSSound), and the video player window
# (src/video_window.rs: NSWindow, NSScreen, NSEvent). The same versions GPUI
# already uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSDate", "NSError", "NSGeometry", "NSRunLoop", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSEvent", "NSGraphics", "NSResponder", "NSScreen", "NSSound", "NSView", "NSWindow"] }
# Reaching a GPUI window's NSWindow, to hide it without closing it
# (src/window_hide.rs). The version GPUI already uses.
raw-window-handle = "0.6"
# "Open RuSToat at login" (SMAppService, macOS 13+; src/login_item.rs).
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
objc2-user-notifications = { version = "0.3", features = ["std", "block2", "UNUserNotificationCenter"] }
block2 = "0.6"
# Which emoji the system's emoji font can draw (src/emoji.rs). GPUI won't
# load Apple Color Emoji as a font itself. The versions GPUI already uses.
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFont", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFCGTypes"] }
# Playing audio and video attachments (src/media_player.rs) and their poster
# frames: AVPlayer, AVAssetImageGenerator and CoreMedia's times. The posters
# arrive as CGImages, drawn into a bitmap to read their pixels.
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "AVAsset", "AVAssetImageGenerator", "AVPlayer", "AVPlayerItem", "AVTime"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "objc2", "CMTime"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
# The video player window's view, with AVKit's own controls.
objc2-av-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-av-foundation", "AVPlayerView"] }

[dev-dependencies]
wiremock = "0.6"
# Trying every bit as a `ChannelPermission` (tests/permission_matrix.rs), so
# the permission list can't miss one. With resolver 2, the feature (and its
# `num_enum`, already in the lock file) only reaches test builds.
revolt-permissions = { version = "=0.16.4", default-features = false, features = ["try-from-primitive"] }
# A scratch directory for the account list file tests. Already in the tree.
tempfile = "3"
# Rendering the app icon's SVG to PNGs (examples/render_icon.rs). The version
# GPUI already uses; it re-exports tiny-skia for the pixel buffer.
resvg = { version = "0.46", default-features = false }

# Runs on the main thread, which AVFoundation's players need (see the file).
[[test]]
name = "media_player"
harness = false
