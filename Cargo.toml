[package]
name = "stoat-gpui"
version = "0.1.0"
edition = "2024"
description = "Proof-of-concept Stoat Chat desktop client built with GPUI"
publish = false

[dependencies]
# Pinned: gpui-kit bundles a specific gpui-pre snapshot plus gpui-component.
gpui-kit = "=0.9.0"

# Wire types straight from the Stoat backend (MIT). Pinned to the live API
# version; bump all revolt-* crates together. Default features pull in the
# Rocket server integration, which a client doesn't need.
revolt-models = { version = "=0.16.2", default-features = false, features = ["serde", "partials"] }
revolt-result = { version = "=0.16.2", default-features = false, features = ["serde"] }

reqwest = { version = "0.13", features = ["json"] }
# Events websocket. rustls with the macOS trust store, matching reqwest's TLS stack.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
url = "2"
# Emoji character classes, for "only emoji" (jumbo) messages. Already in the tree.
unicode-properties = "0.1"
# CSS colour names for `$$\color{…}$$` (see src/math.rs). Already in the tree (via resvg).
svgtypes = "0.16"
# Local-time formatting for message timestamps.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
# Session token storage: macOS Keychain (Windows/Linux stores come along with the v1 feature).
keyring = "4.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
futures = "0.3"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
# Dock badge (AppKit's NSDockTile), and checking whether banners can be
# posted (bundle identifier, notification permission). The same versions GPUI
# already uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSBundle", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-user-notifications = { version = "0.3", features = ["std", "block2", "UNUserNotificationCenter"] }
block2 = "0.6"

[dev-dependencies]
wiremock = "0.6"
# The parser inside TextView (already in the tree), to check what `prepare` produces parses as intended.
markdown = "1"
