[package]
name = "stoat-gpui"
version = "0.1.0"
edition = "2024"
description = "Proof-of-concept Stoat Chat desktop client built with GPUI"
publish = false

[dependencies]
# Pinned: gpui-kit bundles a specific gpui-pre snapshot plus gpui-component.
gpui-kit = "=0.9.0"

# Wire types straight from the Stoat backend (MIT). Pinned to the live API
# version; bump all revolt-* crates together. Default features pull in the
# Rocket server integration, which a client doesn't need.
revolt-models = { version = "=0.16.2", default-features = false, features = ["serde", "partials"] }
revolt-result = { version = "=0.16.2", default-features = false, features = ["serde"] }
# Stoat's own permission maths (owners, role and channel overrides, timeouts),
# for what a user may see or do in a channel. Its `PermissionQuery` trait is
# declared with `#[async_trait]`, so implementing it needs that crate too.
revolt-permissions = { version = "=0.16.2", default-features = false }
async-trait = "0.1"

# `multipart` and `stream` for attachment uploads with progress.
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
# Events websocket. rustls with the macOS trust store, matching reqwest's TLS stack.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
url = "2"
# Emoji character classes, for "only emoji" (jumbo) messages. Already in the tree.
unicode-properties = "0.1"
# CSS colour names for `$$\color{…}$$` (see src/math.rs). Already in the tree (via resvg).
svgtypes = "0.16"
# Blurred previews of uploads while they load (Stoat stores a ThumbHash with each image).
thumbhash = "0.1"
# Pixel buffers for those previews, as GPUI takes them. The version GPUI already uses.
image = { version = "0.25", default-features = false }
# Local-time formatting for message timestamps.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# An attachment's MIME type from its extension. Already in the tree.
mime_guess = "2"
# The QR code for setting up an authenticator app (src/security.rs). Nayuki's
# reference encoder: small, with no dependencies.
qrcodegen = "1.8"
thiserror = "2"
# Session token storage: macOS Keychain (Windows/Linux stores come along with the v1 feature).
keyring = "4.2"
# `fs` and `io-util` for streaming uploads from disk.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "io-util"] }
futures = "0.3"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
emojis = "0.9.1"
# The parser inside TextView (already in the tree, through gpui-base): finding
# links whose text isn't their address (`markdown::guard_links`), and in tests,
# checking what `prepare` produces parses as intended.
markdown = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Dock badge (AppKit's NSDockTile), checking whether banners can be posted
# (bundle identifier, notification permission), hiding the main window
# (NSWindow), and the notification sound (NSSound). The same versions GPUI
# already uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSBundle", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSResponder", "NSSound", "NSView", "NSWindow"] }
# Reaching a GPUI window's NSWindow, to hide it without closing it
# (src/window_hide.rs). The version GPUI already uses.
raw-window-handle = "0.6"
# "Open RuSToat at login" (SMAppService, macOS 13+; src/login_item.rs).
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
objc2-user-notifications = { version = "0.3", features = ["std", "block2", "UNUserNotificationCenter"] }
block2 = "0.6"
# Which emoji the system's emoji font can draw (src/emoji.rs). GPUI won't
# load Apple Color Emoji as a font itself. The versions GPUI already uses.
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFont", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFCGTypes"] }

[dev-dependencies]
wiremock = "0.6"
# A scratch directory for the account list file tests. Already in the tree.
tempfile = "3"
# Rendering the app icon's SVG to PNGs (examples/render_icon.rs). The version
# GPUI already uses; it re-exports tiny-skia for the pixel buffer.
resvg = { version = "0.46", default-features = false }
