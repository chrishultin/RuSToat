# The iPhone app's Xcode project, generated by XcodeGen:
#   cd ios && xcodegen generate
# RuSToat.xcodeproj isn't committed; edit this file instead.
name: RuSToat
options:
  bundleIdPrefix: com.chrishultin.rustoat
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Signing for your own iPhone: automatic, under your team.
    DEVELOPMENT_TEAM: 87ATGCDMGT
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RuSToat:
    type: application
    platform: iOS
    sources:
      - path: RuSToat
    dependencies:
      # Built by scripts/ios/build-core.sh (and the pre-build script below).
      - framework: build/StoatCore.xcframework
        embed: false
    preBuildScripts:
      - name: Build Rust core
        # Cargo decides what's out of date; this always runs.
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/../scripts/ios/build-core.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrishultin.rustoat.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RuSToat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The pre-build script runs cargo, which reads and writes outside
        # the sandbox Xcode gives script phases.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Rust static library needs these system libraries and frameworks.
        OTHER_LDFLAGS: ["-lc++", "-framework", "Security", "-framework", "SystemConfiguration"]
  RuSToatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RuSToatTests
    dependencies:
      - target: RuSToat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrishultin.rustoat.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RuSToat.app/RuSToat"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  RuSToat:
    build:
      targets:
        RuSToat: all
    test:
      targets:
        - RuSToatTests
