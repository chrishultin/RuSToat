# The iPhone app's Xcode project, generated by XcodeGen:
#   cd ios && xcodegen generate
# RuSToat.xcodeproj isn't committed; edit this file instead.
name: RuSToat
options:
  bundleIdPrefix: com.chrishultin.rustoat
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Signing for your own iPhone: automatic, under your team.
    DEVELOPMENT_TEAM: G55L4BQ44C
    CODE_SIGN_STYLE: Automatic
    # The Rust core's C module, for the app and its tests (see the app's
    # LIBRARY_SEARCH_PATHS below).
    SWIFT_INCLUDE_PATHS[sdk=iphoneos*]: $(SRCROOT)/build/StoatCore.xcframework/ios-arm64/Headers
    SWIFT_INCLUDE_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/build/StoatCore.xcframework/ios-arm64-simulator/Headers
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RuSToat:
    type: application
    platform: iOS
    sources:
      - path: RuSToat
        excludes: ["Generated/**"]
      # Written by the pre-build script, so it may not exist yet when the
      # project is generated.
      - path: RuSToat/Generated/StoatCore.swift
        optional: true
        group: RuSToat/Generated
    preBuildScripts:
      - name: Build Rust core
        # Cargo decides what's out of date; this always runs.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/RuSToat/Generated/StoatCore.swift
        script: |
          "$SRCROOT/../scripts/ios/build-core.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrishultin.rustoat.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RuSToat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The pre-build script runs cargo, which reads and writes outside
        # the sandbox Xcode gives script phases.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Rust core, from build/StoatCore.xcframework (made by
        # scripts/ios/build-core.sh, which the pre-build script runs). Read
        # from its slices directly rather than as a linked framework: Xcode
        # copies linked XCFrameworks before any script runs, so after a
        # change to the core's API the first build would use the old one.
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/build/StoatCore.xcframework/ios-arm64
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/build/StoatCore.xcframework/ios-arm64-simulator
        # The core, and the system libraries and frameworks it needs.
        OTHER_LDFLAGS: ["-lstoat_ffi", "-lc++", "-framework", "Security", "-framework", "SystemConfiguration"]
  RuSToatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RuSToatTests
    dependencies:
      - target: RuSToat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrishultin.rustoat.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RuSToat.app/RuSToat"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  RuSToat:
    build:
      targets:
        RuSToat: all
    test:
      targets:
        - RuSToatTests
